<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decked Out WNC — Pipeline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bark: #2B241C;
      --plank: #DCD0B8;
      --plank-line: #C7B996;
      --cedar: #A34E2C;
      --cedar-dark: #7E3A20;
      --moss: #566246;
      --moss-dark: #3F4834;
      --slate: #6B6558;
      --rust: #7A3226;
      --chalk: #F5F1E6;
      --r-btn: 6px;
      --r-pill: 999px;
      --r-card: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Public Sans', system-ui, sans-serif;
      background: var(--plank);
      color: var(--bark);
      margin: 0;
      padding: 2rem 1.25rem;
      min-height: 100vh;
    }

    h1, h2, h3, h4 {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      color: var(--bark);
      margin: 0 0 0.5rem 0;
      font-weight: 600;
    }
    h1 { font-size: 2rem; font-weight: 700; }
    h2 { font-size: 1.4rem; }
    h3 { font-size: 1.15rem; }
    h4 { font-size: 1rem; color: var(--slate); }

    #login-view, #app-view { display: none; }

    /* ---- Login: the one deliberate bold moment ---- */
    #login-view {
      max-width: 380px;
      margin: 4rem auto 0;
      background: var(--chalk);
      border-radius: var(--r-card);
      padding: 2.25rem 2rem 2rem;
      box-shadow: 0 1px 3px rgba(43,36,28,.1), 0 8px 24px rgba(43,36,28,.12);
    }
    #login-view h1 {
      font-size: 1.9rem;
      line-height: 1.1;
      letter-spacing: 0.01em;
    }
    #login-view .rule {
      width: 64px;
      height: 3px;
      background: var(--cedar);
      border: none;
      margin: 0.6rem 0 1.5rem;
      border-radius: 2px;
    }
    #login-form { display: flex; flex-direction: column; gap: 0.7rem; }

    /* ---- Shared form controls ---- */
    input[type="email"], input[type="password"], input[type="text"],
    input[type="number"], input[type="date"], input[type="file"], textarea {
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--bark);
      background: var(--chalk);
      border: 1px solid var(--plank-line);
      border-radius: var(--r-btn);
      padding: 10px 12px;
      min-height: 44px;
    }
    input:focus {
      outline: 2px solid var(--cedar);
      outline-offset: 1px;
      border-color: var(--cedar);
    }
    #app-view input[type="email"], #app-view input[type="password"],
    #app-view input[type="text"], #app-view input[type="number"],
    #app-view input[type="date"], #app-view input[type="file"], #app-view textarea {
      background: #fff;
    }

    /* ---- Buttons: structural pattern ported from AWD Job Tracker ---- */
    button {
      font-family: inherit;
      font-weight: 700;
      border: none;
      border-radius: var(--r-btn);
      cursor: pointer;
      transition: background .15s;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .btn-primary {
      background: var(--cedar);
      color: var(--chalk);
      padding: 10px 16px;
      font-size: 0.9rem;
      min-height: 44px;
    }
    .btn-primary:hover { background: var(--cedar-dark); }

    .btn-primary-block {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 4px;
    }

    .btn-quiet {
      background: none;
      color: var(--bark);
      border: 1.5px solid var(--plank-line);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 44px;
    }
    .btn-quiet:hover { border-color: var(--slate); background: rgba(43,36,28,.04); }

    /* Pill "advance stage" control — the primary in-flow action per job */
    .stage-select {
      display: block;
      width: 100%;
      background: var(--cedar);
      color: var(--chalk);
      border: none;
      border-radius: var(--r-pill);
      padding: 9px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform .1s, box-shadow .1s;
    }
    .stage-select:hover { transform: scale(1.02); box-shadow: 0 2px 10px rgba(163,78,44,.35); }

    /* Independent photo-capture trigger — opens the OS's own camera/library
       picker; deliberately not squeezed inline with the text fields. */
    .photo-capture-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 64px;
      background: var(--chalk);
      border: 3px dashed var(--cedar);
      border-radius: var(--r-card);
      color: var(--cedar-dark);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .photo-capture-btn:hover { background: #fff; border-color: var(--cedar-dark); }
    #receipt-file-status {
      font-size: 0.85rem;
      color: var(--slate);
      margin: 0.4rem 0 0;
    }
    #receipt-file-status.has-file { color: var(--moss-dark); font-weight: 600; }

    /* ---- Layout ---- */
    #app-view { max-width: 760px; margin: 0 auto; }
    #app-view > h1 { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    #app-view > h1 #signout-btn { font-size: 0.85rem; }

    #app-error, #login-error {
      color: var(--rust);
      font-weight: 600;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    #new-lead-section {
      background: var(--chalk);
      border: 1px solid var(--plank-line);
      border-radius: var(--r-card);
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    #new-lead-form, #add-receipt-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }
    #new-lead-form input, #add-receipt-form input { flex: 1 1 160px; }
    #new-lead-form button, #add-receipt-form button { flex: 0 0 auto; }
    #add-receipt-form .photo-capture-btn,
    #add-receipt-form #receipt-file-status { flex-basis: 100%; }

    .job-card {
      background: var(--chalk);
      border: 1px solid var(--plank-line);
      border-radius: var(--r-card);
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 3px rgba(43,36,28,.06), 0 1px 2px rgba(43,36,28,.04);
      transition: box-shadow .15s, border-color .15s;
    }
    .job-card:hover { border-color: var(--slate); box-shadow: 0 4px 12px rgba(43,36,28,.1); }
    .job-card h3 { margin: 0 0 0.4rem 0; }

    .stage-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: var(--r-pill);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--chalk);
      background: var(--slate);
      letter-spacing: 0.01em;
    }
    .stage-badge.stage-won { background: var(--moss); }
    .stage-badge.stage-lost { background: var(--rust); }

    .job-card .btn-quiet { margin-top: 0.6rem; }

    #job-detail-section #back-to-list-btn { margin-bottom: 1rem; }
    #job-detail-title { margin-bottom: 0.3rem; }

    #receipts-section {
      background: var(--chalk);
      border: 1px solid var(--plank-line);
      border-radius: var(--r-card);
      padding: 1.1rem 1.25rem;
      margin-top: 1.25rem;
    }
    #receipts-total {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--moss-dark);
      margin: 0 0 0.75rem 0;
    }
    .receipt-row {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--plank-line);
      font-size: 0.92rem;
    }
    .receipt-row:last-of-type { border-bottom: none; }
    .receipt-row a { color: var(--cedar-dark); font-weight: 600; text-decoration: none; }
    .receipt-row a:hover { text-decoration: underline; }

    #add-receipt-form { margin-top: 0.75rem; }

    #receipts-staff-only-notice {
      color: var(--slate);
      font-style: italic;
      font-size: 0.9rem;
    }

    textarea {
      font-family: inherit;
      resize: vertical;
      width: 100%;
    }

    .activity-entry {
      display: flex;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--plank-line);
    }
    .activity-entry:last-of-type { border-bottom: none; }
    .activity-entry img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: var(--r-btn);
      border: 1px solid var(--plank-line);
      flex-shrink: 0;
    }
    .activity-entry .activity-body { flex: 1; font-size: 0.92rem; }
    .activity-entry .activity-meta {
      font-size: 0.78rem;
      color: var(--slate);
      margin-top: 2px;
    }

    #add-activity-form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="login-view">
    <h1>Decked Out WNC</h1>
    <hr class="rule" />
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit" class="btn-primary btn-primary-block">Sign In</button>
    </form>
    <p id="login-error"></p>
  </div>

  <div id="app-view">
    <h1>Pipeline <button id="signout-btn" class="btn-quiet">Sign Out</button></h1>
    <p id="app-error"></p>

    <div id="pipeline-section">
      <div id="new-lead-section">
        <h2>New Lead</h2>
        <form id="new-lead-form">
          <input type="text" id="lead-customer-name" placeholder="Customer name" required />
          <input type="text" id="lead-address" placeholder="Job address" required />
          <button type="submit" class="btn-primary">Add Lead</button>
        </form>
      </div>
      <h2>Jobs</h2>
      <div id="job-list"></div>
    </div>

    <div id="job-detail-section" hidden>
      <button id="back-to-list-btn" class="btn-quiet">&larr; Back to Pipeline</button>
      <h2 id="job-detail-title"></h2>
      <p id="job-detail-status" class="stage-badge"></p>

      <div id="receipts-section">
        <h3>Materials Receipts</h3>
        <p id="receipts-total"></p>
        <div id="receipts-list"></div>
        <h4>Add Receipt</h4>
        <form id="add-receipt-form">
          <input type="number" id="receipt-amount" placeholder="Amount" step="0.01" min="0" required />
          <input type="text" id="receipt-vendor" placeholder="Vendor" required />
          <input type="date" id="receipt-date" required />
          <button type="button" id="receipt-photo-btn" class="photo-capture-btn">📷 Add Receipt Photo</button>
          <input type="file" id="receipt-file" accept="image/*,application/pdf" hidden />
          <p id="receipt-file-status">No photo selected yet</p>
          <button type="submit" class="btn-primary">Add Receipt</button>
        </form>
      </div>
      <p id="receipts-staff-only-notice" hidden>Materials receipts are only visible to staff.</p>

      <div id="activity-section">
        <h3>Job Activity</h3>
        <div id="activity-list"></div>
        <form id="add-activity-form">
          <textarea id="activity-text" placeholder="Add a note (optional)..." rows="2"></textarea>
          <button type="button" id="activity-photo-btn" class="photo-capture-btn">📷 Add Photo</button>
          <input type="file" id="activity-file" accept="image/*" hidden />
          <p id="activity-file-status">No photo selected yet</p>
          <button type="submit" class="btn-primary">Post Update</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
